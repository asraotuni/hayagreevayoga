<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#244d40"><title>Your Profile | Hayagreeva</title><link rel="stylesheet" href="/styles.css"></head>
<body><header class="site-header wrap"><a class="brand" href="/" aria-label="Hayagreeva home">HAYAGREEVA<span class="brand-sub">YOUR PROFILE</span></a><div class="header-actions"><a class="portal-label" href="/">All services ↗</a><span data-auth-mount></span></div></header>
<main class="case-panel wrap profile-page"><p class="eyebrow">YOUR DETAILS</p><h1>Your <em>profile</em></h1><p class="case-intro">Keep your details current. Matching fields are used to prefill your service forms.</p><p id="profile-status" class="draft-notice" role="status">Loading your profile…</p><form id="profile-form" hidden><fieldset><legend>Personal details</legend><div class="form-grid"><div class="field"><label for="profile-first-name">First Name</label><input id="profile-first-name" autocomplete="given-name" required></div><div class="field"><label for="profile-last-name">Last Name</label><input id="profile-last-name" autocomplete="family-name" required></div><div class="field"><label for="profile-dob">Date of Birth</label><input id="profile-dob" type="date" autocomplete="bday"></div><div class="field"><label for="profile-email">Email</label><input id="profile-email" type="email" readonly></div><div class="field"><label for="profile-mobile">Mobile number</label><input id="profile-mobile" type="tel" autocomplete="tel" placeholder="+91 98765 43210"></div></div></fieldset><fieldset><legend>Address</legend><div class="form-grid"><div class="field appointment-wide"><label for="profile-address-line1">Address line 1</label><input id="profile-address-line1" autocomplete="address-line1"></div><div class="field appointment-wide"><label for="profile-address-line2">Address line 2</label><input id="profile-address-line2" autocomplete="address-line2"></div><div class="field appointment-wide"><label for="profile-address-line3">Address line 3</label><input id="profile-address-line3" autocomplete="address-line3"></div><div class="field"><label for="profile-country">Country</label><input id="profile-country" autocomplete="country-name" value="India"></div><div class="field"><label for="profile-state">State</label><input id="profile-state" autocomplete="address-level1"></div><div class="field"><label for="profile-pin">PIN code</label><input id="profile-pin" autocomplete="postal-code" maxlength="20"></div></div></fieldset><div class="form-actions"><button class="button" type="submit">Save profile</button><a class="clear-button" href="/">Cancel</a></div></form></main><script src="/auth/auth-client.js?v=ddb-1" type="module"></script><script src="/profile/profile.js?v=ddb-1" type="module"></script></body></html>
